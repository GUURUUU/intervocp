# PostgreSQL database for IntervOCP (development / demo).
# Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: intervocp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: intervocp
      POSTGRES_PASSWORD: intervocp
      POSTGRES_DB: intervocp
    ports:
      - "5432:5432"
    volumes:
      - intervocp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervocp -d intervocp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intervocp_pgdata:
